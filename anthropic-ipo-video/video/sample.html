<script>
// Transparent graphics layer over the footage bed. A pure function of time t; all timing comes from plan.js.
const W = 1920, H = 1080, DURATION = PLAN.total, CUTS = PLAN.cuts, NARR_END = DURATION - 5;
const g = document.getElementById('c').getContext('2d');
const C = { w: '#ffffff', y: '#ffe600', r: '#ff2a2a', dim: 'rgba(255,255,255,.74)' };
const SANS = '"Inter Display", Inter, sans-serif', MONO = '"JetBrains Mono", monospace';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a)), outCubic = k => 1 - Math.pow(1 - k, 3), outExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);

function text(s, x, y, o = {}) {

const bar = (x, y, wd, h, col, t, at, d = .35) => { const k = outExpo(prog(t, at, at + d)); if (k > 0) { g.fillStyle = col; g.fillRect(x, y, wd * k, h); } };

  g.beginPath(); g.arc(0, -34, 16, 0, 7); g.fill(); g.beginPath(); g.roundRect(-24, -12, 48, 62, 20); g.fill(); g.restore(); }
const BRAND = { anthropic: '#e08a6a', claude: '#e08a6a', google: '#ffffff', googlegemini: '#9d8bff', facebook: '#3b8cff', uber: '#ffffff', spacex: '#ffffff', nvidia: '#76b900' }, PATHS = {};
// a company mark, centred on (cx, cy) and `size` pixels square

// the loss, shown where it actually comes from: the company's own statement of operations
function A(t) { bg('#120d0e', '#070708'); glow(1500, 560, 900, 'rgba(255,60,50,.20)');
  const k = outCubic(prog(t, .15, .75)); g.save(); g.globalAlpha = k; g.translate(140, 150 + (1 - k) * 70); g.rotate(-.022); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 60; g.shadowOffsetY = 24; rr(0, 0, 860, 790, 10, '#f4f1ea'); g.shadowColor = 'transparent';

  g.fillStyle = 'rgba(20,20,19,.25)'; g.fillRect(56, 222, 748, 2);
  const hk = outExpo(prog(t, 3.1, 3.6)); if (hk > 0) { g.fillStyle = 'rgba(255,90,77,.30)'; g.fillRect(40, 566, 780 * hk, 84); }
  [['Revenue', '16,286', .7], ['Loss from operations', '(693)', 1.0], ['Change in fair value of notes', '(72,388)', 1.3], ['Net loss', '(80,748)', 1.6]].forEach(([n, v, at], i) => { const kk = outCubic(prog(t, at, at + .35)); if (kk <= 0) return; const y = 310 + i * 104, last = i === 3; g.globalAlpha = k * kk;
    ink(n, 56, y, { font: CLD, weight: last ? 600 : 400, size: 40 }); ink(v, 804, y, { font: NUM, weight: last ? 600 : 500, size: 38, align: 'right', color: last && hk > 0 ? '#b3261e' : INK }); if (i < 3) { g.fillStyle = 'rgba(20,20,19,.12)'; g.fillRect(56, y + 34, 748, 1.5); } });
  g.globalAlpha = k; ink('Figures from the company’s S-1 filing. Layout simplified.', 56, 742, { font: UI, weight: 400, size: 19, color: 'rgba(20,20,19,.55)' }); g.restore();
  cap('REPORTED NET LOSS', 1094, 330, t, 2.5); const c = count(t, 3.15, .9); rise('−$' + (80.7 * c).toFixed(1), 1070, 590, { weight: 600, size: 250, color: RD, spacing: -8 }, t, 3.15, .3); rise('billion', 1094, 730, { weight: 400, italic: true, size: 130, color: RD }, t, 3.78);
  rise('in six months', 1094, 880, { weight: 400, size: 84 }, t, 5.15); mark(1094 + wd('in ', { weight: 400, size: 84 }), 900, wd('six months', { weight: 400, size: 84 }), 8, YL, t, 5.45); }
function B(t) { clear(); rise('Going public', 140, 700, { size: 150, spacing: -3 }, t, 6.45, .3); rise('Thursday.', 140, 860, { italic: true, size: 150, color: YL, spacing: -3 }, t, 6.8, .3);
  g.fillStyle = 'rgba(0,0,0,.85)'; g.fillRect(0, 940, W, 76); g.fillStyle = YL; g.fillRect(0, 940, W, 2); g.save(); g.beginPath(); g.rect(0, 940, W, 76); g.clip(); const s = 'ANT ▲    NASDAQ    ·    IPO price range $70 – $78    ·    Listing Thursday    ·    ', o = { font: NUM, weight: 500, size: 34, color: YL, blur: 0 }, w0 = width(s, o);
  for (let x = -((t * 300) % w0); x < W; x += w0) text(s, x, 990, o); g.restore(); }
function Cc(t) { bg('#0a1f44', '#04070d'); glow(300, 900, 800, 'rgba(255,216,74,.10)'); rise('Investors want in.', 140, 220, { size: 110, spacing: -2 }, t, 8.3); cap('SHARES FOR SALE', 144, 330, t, 9.0, { color: '#fff' }); rr(140, 350, 250 * outBack(prog(t, 9.0, 9.35)), 110, 14, '#fff');
  cap('ORDERS FROM INVESTORS', 144, 540, t, 9.9, { color: YL }); let n = 0; for (let i = 0; i < 6; i++) { const at = 10.1 + i * .27, kk = outBack(prog(t, at, at + .25)); if (kk <= 0) continue; n++; rr(140 + i * 270 + 125 * (1 - kk), 560 + 55 * (1 - kk), 250 * kk, 110 * kk, 14, YL); }
  if (n) { text(n + '×', 132, 960, { font: DISP, weight: 700, size: 270, color: YL, spacing: -6, blur: 16 }); rise('the shares on offer', 560, 930, { weight: 400, italic: true, size: 88 }, t, 12.3); }
  src('Bloomberg, Reuters', t, 10.4); }
// Anthropic and Claude in their own look: cream paper, dark ink, a terracotta accent and a serif
function D(t) { g.fillStyle = CREAM; g.fillRect(0, 0, W, H); g.fillStyle = CLAY; g.fillRect(0, 0, 22, H); const ink = (s, x, y, o) => text(s, x, y, { color: INK, blur: 0, font: CLD, ...o }), d6 = 'rgba(20,20,19,.6)';
  photo('amodei', 1300, 240, 460, t, 14.5); const pk = prog(t, 14.9, 15.2); if (pk > 0) { ink('Dario Amodei, chief executive', 1530, 762, { italic: true, weight: 400, size: 34, align: 'center', alpha: pk }); ink('Photo: TechCrunch  ·  CC BY 2.0', 1530, 800, { font: UI, weight: 500, size: 18, align: 'center', color: d6, alpha: pk }); }
  if (t < 16.3) { const a = outCubic(prog(t, 14.1, 14.5)); ink('The company', 150, 330 + (1 - a) * 20, { italic: true, weight: 400, size: 52, color: d6, alpha: a }); logo('anthropic', 240, 500, 180, t, 14.6, INK); const b = outCubic(prog(t, 14.9, 15.3)); ink('ANTHROPIC', 140, 780 + (1 - b) * 24, { font: UI, weight: 700, size: 132, spacing: 10, alpha: b }); return; }
  const a = outCubic(prog(t, 16.4, 16.8)); ink('It makes an AI model called', 150, 250 + (1 - a) * 20, { italic: true, weight: 400, size: 52, color: d6, alpha: a });
  const sk = outBack(prog(t, 17.6, 18.1)); if (sk > 0) { g.save(); g.translate(240, 420); g.rotate((1 - sk) * -1.6); g.translate(-240, -420); logo('claude', 240, 420, 190, t, -1, CLAY); g.restore(); }
  const c = outCubic(prog(t, 18.1, 18.5)); ink('Claude', 380, 490 + (1 - c) * 24, { weight: 500, size: 250, spacing: -4, alpha: c });
  const bk = outCubic(prog(t, 16.5, 16.8)); if (bk > 0) { g.globalAlpha = bk; rr(150, 590, 1040, 124, 28, '#fff'); g.strokeStyle = 'rgba(20,20,19,.18)'; g.lineWidth = 2; g.beginPath(); g.roundRect(150, 590, 1040, 124, 28); g.stroke(); g.globalAlpha = 1; const q = 'Review this 90-page contract for risks.', m = Math.floor(prog(t, 16.7, 17.9) * q.length); ink(q.slice(0, m) + (m < q.length ? '▍' : ''), 194, 668, { font: UI, weight: 400, size: 46 }); }
  [0, 1, 2].forEach(i => rr(150, 760 + i * 62, [780, 900, 560][i] * grow(t, 18.0 + i * .22, .6), 30, 15, i === 0 ? CLAY : 'rgba(20,20,19,.2)')); }
function Ev(t) { bg('#1c1503', '#060607'); glow(1500, 900, 900, 'rgba(255,216,74,.10)'); rise('What Anthropic would be worth', 140, 200, { weight: 600, size: 76, spacing: -1 }, t, 19.2);

function F(t) { clear(); cap('WHY THIS MATTERS TO YOU', 144, 640, t, 25.4); rise('Even if you never', 140, 780, { weight: 600, size: 124, spacing: -2 }, t, 26.6); rise('buy a single share.', 140, 920, { weight: 600, italic: true, size: 124, color: YL, spacing: -2 }, t, 27.9); }

    const col = k > 0 && last ? '#111' : '#fff', o = { font: UI, weight: 600, size: 42, align: 'center', color: col, blur: 0 }; text(a, x + 180, 425, o); text(b, x + 180, 482, { ...o, weight: 400 }); g.restore();
    if (i < 3 && t > at) { const x1 = x + 366, on = t > N[i + 1][2] - .3; g.fillStyle = on ? YL : 'rgba(255,255,255,.35)'; g.fillRect(x1, 433, 48, 4); for (let d = 0; d < 2; d++) { const p = ((t * 1.6 + d * .5) % 1); g.beginPath(); g.arc(x1 + 48 * p, 435, 7, 0, 7); g.fill(); } } });

  const k = outCubic(prog(t, 37.7, 38.1)); if (k > 0) { g.save(); g.beginPath(); g.roundRect(1160, 600, 620 * k, 380, 22); g.clip(); g.clearRect(1160, 600, 620, 380); g.restore(); g.strokeStyle = YL; g.lineWidth = 5; g.beginPath(); g.roundRect(1160, 600, 620 * k, 380, 22); g.stroke(); g.fillStyle = YL; g.fillRect(1578, 530, 4, 70 * k); } }
function Hh(t) { bg('#131116', '#050506'); rise('Who really wins?', 140, 240, { size: 110, spacing: -2 }, t, 41.2); g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(200, 598, 1520 * grow(t, 41.0, 1.4), 4);
