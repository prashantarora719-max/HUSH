      g.globalAlpha = k0; g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(140, y, 1640, 90); g.globalAlpha = 1; g.fillStyle = C[c]; g.fillRect(140, y, 1640 * v / 100 * outExpo(prog(t, at - .2, at + .6)), 90);
      pop(s, 1780, y + 180, { size: 100, align: 'right', color: C[c], spacing: -3 }, t, at); });
