<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Can Nvidia Fall?</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1920px;height:1080px}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script src="assets.js"></script>
<script>
// Every frame is a pure function of time t (seconds). Scene times come from the
// narration's word timings in timeline.js, so pictures land on the words.
// Preview in a browser with ?play (add &t=120 to start at 2:00).
const W_ = 1920, H_ = 1080, TL = window.TL, DURATION = TL.total;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const C = { bg: '#07090a', ink: '#f2f5f0', dim: '#7d877c', line: '#1a201b', green: '#84e11a', red: '#ff3d3d',
            amber: '#ffb020', sepia: '#d9b98a', panel: '#0e1310' };
const DISPLAY = '"Inter Display", Inter, sans-serif', MONO = '"JetBrains Mono", monospace';
const portrait = new Image(); portrait.src = window.PORTRAIT;

// ---------- timing ----------
const q = (s, i) => TL.sections[s].sentences[i].start;      // start of sentence i in section s
const S = s => TL.sections[s].start, E = s => TL.sections[s].end;
const w = (s, word, n = 0) => { const m = TL.sections[s].words.filter(x => x[0] === word); return (m[n] || m[m.length - 1] || [0, S(s)])[1]; };

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = k => 1 - Math.pow(1 - k, 3);
const inOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outBack = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);
const ap = (t, at, d = .6) => outCubic(prog(t, at, at + d));
function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

// ---------- drawing ----------
function text(s, x, y, o = {}) {
  g.save();
  g.font = `${o.weight || 700} ${o.size || 40}px ${o.font || DISPLAY}`;
  g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic';
  g.globalAlpha *= o.alpha ?? 1;
  if (o.spacing) g.letterSpacing = o.spacing + 'px';
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.blur || 40; }
  g.fillStyle = o.color || C.ink; g.fillText(s, x, y); g.restore();
}
function width(s, o = {}) { g.save(); g.font = `${o.weight || 700} ${o.size || 40}px ${o.font || DISPLAY}`; if (o.spacing) g.letterSpacing = o.spacing + 'px'; const m = g.measureText(s).width; g.restore(); return m; }
// text that rises into place
function tin(s, x, y, o, t, at, d = .6) { const k = ap(t, at, d); if (k > 0) text(s, x, y + (1 - k) * 28, { ...o, alpha: (o.alpha ?? 1) * k }); }
const mono = (o = {}) => ({ font: MONO, size: 28, weight: 500, color: C.dim, spacing: 5, ...o });
function typed(s, t, a, cps = 22) { return s.slice(0, Math.max(0, Math.floor((t - a) * cps))); }
function rect(x, y, wd, h, color, glow = 0, r = 0) {
  g.save(); g.fillStyle = color; if (glow) { g.shadowColor = color; g.shadowBlur = glow; }
  g.beginPath(); g.roundRect(x, y, wd, h, r); g.fill(); g.restore();
}
function panel(x, y, wd, h, stroke = C.line, glow = 0) {
  g.save(); g.fillStyle = C.panel; g.strokeStyle = stroke; g.lineWidth = 3;
  if (glow) { g.shadowColor = stroke; g.shadowBlur = glow; }
  g.beginPath(); g.roundRect(x, y, wd, h, 16); g.fill(); g.stroke(); g.restore();
}
function polyline(pts, k, color, wd = 6, glow = 28) {
  if (k <= 0) return pts[0];
  const n = pts.length - 1, f = clamp(k) * n, i = Math.min(n - 1, Math.floor(f)), r = f - i;
  g.save(); g.strokeStyle = color; g.lineWidth = wd; g.lineJoin = 'round'; g.lineCap = 'round';
  g.shadowColor = color; g.shadowBlur = glow;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let j = 1; j <= i; j++) g.lineTo(pts[j][0], pts[j][1]);
  const tip = [lerp(pts[i][0], pts[i + 1][0], r), lerp(pts[i][1], pts[i + 1][1], r)];
  g.lineTo(tip[0], tip[1]); g.stroke(); g.restore(); return tip;
}
function dot(p, color, r = 10) { g.save(); g.fillStyle = color; g.shadowColor = color; g.shadowBlur = 30; g.beginPath(); g.arc(p[0], p[1], r, 0, 7); g.fill(); g.restore(); }
function ring(cx, cy, r, from, frac, color, wd = 46, glow = 30) {
  if (frac <= 0) return;
  g.save(); g.strokeStyle = color; g.lineWidth = wd; g.shadowColor = color; g.shadowBlur = glow;
  g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2 + from * Math.PI * 2, -Math.PI / 2 + (from + frac) * Math.PI * 2); g.stroke(); g.restore();
}
function arrow(x1, y1, x2, y2, color, k = 1, wd = 6) {
  if (k <= 0) return;
  const x = lerp(x1, x2, k), y = lerp(y1, y2, k), a = Math.atan2(y2 - y1, x2 - x1);
  g.save(); g.strokeStyle = color; g.fillStyle = color; g.lineWidth = wd; g.lineCap = 'round'; g.shadowColor = color; g.shadowBlur = 16;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x, y); g.stroke();
  g.translate(x, y); g.rotate(a); g.beginPath(); g.moveTo(8, 0); g.lineTo(-16, -12); g.lineTo(-16, 12); g.closePath(); g.fill(); g.restore();
}
function head(label, title, t, at, o = {}) {
  tin(label, 160, 170, mono(), t, at);
  if (title) tin(title, 160, 258, { size: o.size || 72, weight: 800, color: o.color }, t, at + .15);
}
function source(s, t, at) { tin(s, 160, 1010, mono({ size: 20, spacing: 2 }), t, at, .8); }

// the chip with five cracks: the running device of the film
const CRACKS = (() => {
  const r = rng(42);
  return [-2.5, -0.62, 0.52, 2.3, 3.5].map(ang => {
    const pts = [[0, 0]]; let x = 0, y = 0, a = ang;
    for (let s = 0; s < 9; s++) { a += (r() - .5) * .9; const d = 26 + r() * 22; x += Math.cos(a) * d; y += Math.sin(a) * d; a = lerp(a, ang, .6); pts.push([x, y]); }
    return pts;
  });
})();
function chip(cx, cy, s, lit = [], color = C.green) {
  const k = s / 300;
  g.save(); g.translate(cx, cy); g.scale(k, k);
  g.strokeStyle = color; g.lineWidth = 4; g.shadowColor = color; g.shadowBlur = 20;
  g.beginPath();
  for (let i = 0; i < 9; i++) { const p = -124 + i * 31;
    g.moveTo(p, -184); g.lineTo(p, -150); g.moveTo(p, 150); g.lineTo(p, 184);
    g.moveTo(-184, p); g.lineTo(-150, p); g.moveTo(150, p); g.lineTo(184, p); }
  g.stroke();
  g.fillStyle = '#0c120d'; g.beginPath(); g.roundRect(-150, -150, 300, 300, 14); g.fill(); g.stroke(); g.shadowBlur = 0;
  g.globalAlpha *= .35; g.lineWidth = 2; g.strokeRect(-94, -94, 188, 188); g.globalAlpha /= .35;
  CRACKS.forEach((pts, i) => { if (lit[i] > 0) polyline(pts, lit[i], C.red, 5 / Math.max(k, .5)); });
  g.restore();
}
const CHAPTERS = ['THE CUSTOMERS', 'THE MONEY LOOP', 'THE BILL', 'CHINA', 'ONE MAN'];

function background(t) {
  g.fillStyle = C.bg; g.fillRect(0, 0, W_, H_);
  g.save(); g.strokeStyle = C.line; g.lineWidth = 1;
  const off = (t * 6) % 80;
  g.beginPath();
  for (let x = -off; x < W_; x += 80) { g.moveTo(x, 0); g.lineTo(x, H_); }
  for (let y = 0; y < H_; y += 80) { g.moveTo(0, y); g.lineTo(W_, y); }
  g.stroke();
  const v = g.createRadialGradient(W_ / 2, H_ / 2, 300, W_ / 2, H_ / 2, 1150);
  v.addColorStop(0, 'rgba(7,9,10,0)'); v.addColorStop(1, 'rgba(0,0,0,.92)');
  g.fillStyle = v; g.fillRect(0, 0, W_, H_); g.restore();
}

// ---------- scenes ----------
const scenes = [];
const scene = (start, fn, o = {}) => scenes.push({ start, fn, ...o });

// ===== 0. COLD OPEN =====
const rise = (() => { const r = rng(7), pts = [];
  for (let i = 0; i <= 60; i++) { const k = i / 60; pts.push([200 + k * 1520, i === 60 ? 320 : 880 - Math.pow(k, 3.2) * 560 + (r() - .5) * 46 * (.3 + k)]); }
  return pts; })();
scene(0, t => {
  text(typed('OCTOBER 6, 2026  ·  NASDAQ: NVDA', t, .5, 28), 200, 190, mono({ size: 30, spacing: 4 }));
  const k = inOut(prog(t, 1.2, w(0, 'trillion') + .3));
  g.globalAlpha *= .5; const tip = polyline(rise, k, C.green, 5); g.globalAlpha /= .5;
  if (k > 0) dot(tip, C.green, 9 + 3 * Math.sin(t * 6));
  const s = '$' + lerp(.6, 5.8, k).toFixed(1);
  text(s, 200, 560, { size: 300, weight: 900, glow: k >= 1 ? C.green : null, blur: 60 });
  text('TRILLION', 236 + width(s, { size: 300, weight: 900 }), 560, { size: 92, weight: 800, color: C.green, spacing: 6 });
  tin('MARKET VALUE OF ONE COMPANY', 206, 640, mono(), t, w(0, 'trillion') + .4);
});
scene(q(0, 1) - .3, t => {
  const a = q(0, 1);
  tin('HOW BIG IS $5.8 TRILLION?', 200, 250, mono({ size: 30 }), t, a - .2);
  [['NVIDIA', 'market value', 5.8, C.green, a - .1], ['JAPAN', 'entire annual economy', 4.3, C.ink, a + .5]].forEach(([name, sub, v, col, at], i) => {
    const y = 400 + i * 250, k = outCubic(prog(t, at, at + 1));
    text(name, 200, y - 24, { size: 64, weight: 900, alpha: prog(t, at - .2, at + .2) });
    text(sub, 200 + (i ? 250 : 290), y - 26, { size: 30, weight: 500, color: C.dim, alpha: prog(t, at - .2, at + .2) });
    rect(200, y, v / 5.8 * 1250 * k, 74, col, i ? 0 : 36);
    if (k > 0) text('$' + (v * k).toFixed(1) + 'T', 228 + v / 5.8 * 1250 * k, y + 58, { size: 64, weight: 800, color: col });
  });
  source('JAPAN: APPROXIMATE NOMINAL GDP, IMF ESTIMATE', t, a + 1.2);
});
const fall = [[0, 243], [3, 236], [6, 229], [9, 221], [12, 226], [15, 214], [18, 209], [21, 213], [24, 205], [26, 200], [28, 182], [31, 187], [34, 179], [35, 169]];
scene(q(0, 2) - .25, t => {
  const a = q(0, 2), b = w(0, 'one', 1) - .15;
  const slam = prog(t, a, a + .4), hold = 1 - prog(t, b - .1, b + .35);
  if (hold > 0) { g.save(); g.globalAlpha *= hold * slam; g.translate(W_ / 2, H_ / 2); const s = lerp(1.6, 1, outCubic(slam)); g.scale(s, s);
    text('FIVE WEEKS LATER', 0, 30, { size: 170, weight: 900, align: 'center', spacing: 2 }); g.restore(); }
  const cIn = prog(t, b, b + .5); if (cIn <= 0) return;
  g.save(); g.globalAlpha *= cIn;
  const k = prog(t, b + .2, b + 2.3), sh = k > 0 && k < 1 ? 7 * Math.sin(t * 61) * (.4 + k) : 0;
  g.translate(sh, sh * .6);
  const X = d => 200 + d / 35 * 880, Y = p => 260 + (250 - p) / 90 * 560;
  g.strokeStyle = C.line; g.lineWidth = 2; g.setLineDash([8, 10]);
  [240, 200, 170].forEach(p => { g.beginPath(); g.moveTo(200, Y(p)); g.lineTo(1100, Y(p)); g.stroke(); text('$' + p, 150, Y(p) + 8, mono({ size: 22, spacing: 0, align: 'right' })); });
  g.setLineDash([]);
  const pts = fall.map(([d, p]) => [X(d), Y(p)]);
  dot(pts[0], C.green, 9); text('OCT 6 · $243', pts[0][0] + 22, pts[0][1] - 22, mono({ size: 26, weight: 600, color: C.green, spacing: 0 }));
  const tip = polyline(pts, inOut(k), C.red, 7); if (k > 0) dot(tip, C.red, 11);
  if (k >= 1) text('NOV 10 · $169', tip[0] - 250, tip[1] + 62, mono({ size: 26, weight: 600, color: C.red, spacing: 0 }));
  text('−$' + (1.7 * inOut(k)).toFixed(1), 1210, 560, { size: 210, weight: 900, color: C.red, glow: C.red, blur: 50 });
  text('TRILLION', 1216, 660, { size: 84, weight: 800, color: C.red, spacing: 6 });
  tin('IN MARKET VALUE, GONE', 1220, 730, mono({ spacing: 4 }), t, b + 2.3);
  g.restore();
});
function revenueBars(t, rows, at, base = 820, hmax = 400) {
  const max = Math.max(...rows.map(r => r[1]));
  rows.forEach(([lab, v, col, when, x, unit = 'B']) => {
    const k = outCubic(prog(t, when, when + 1.1)), h = v / max * hmax * k;
    rect(x, base - h, 300, h, col, col === C.dim ? 0 : 40);
    if (k > 0) text('$' + (v * k).toFixed(v < 100 && v % 1 ? 1 : 0) + unit, x + 150, base - h - 28, { size: 78, weight: 900, align: 'center', color: col === C.dim ? C.ink : col });
    tin(lab, x + 150, base + 50, mono({ size: 26, align: 'center', spacing: 3 }), t, when - .2);
  });
  rect(160, base, 1600, 3, C.dim);
}
scene(q(0, 3) - .3, t => {
  head('MEANWHILE, THE ACTUAL BUSINESS', 'Revenue in a single quarter', t, q(0, 3) - .1);
  revenueBars(t, [['SUMMER 2025', 46.7, C.dim, q(0, 4) - .2, 460], ['SUMMER 2026', 96.2, C.green, w(0, 'ninety-six') - .2, 880]]);
  const b = prog(t, q(0, 5), q(0, 5) + .5);
  if (b > 0) { g.save(); g.translate(1540, 560); g.scale(outBack(b), outBack(b)); g.rotate(-.06);
    text('+106%', 0, 0, { size: 130, weight: 900, align: 'center', color: C.green, glow: C.green });
    text('YEAR OVER YEAR', 0, 60, mono({ size: 26, weight: 600, align: 'center', color: C.ink, spacing: 4 })); g.restore(); }
});
function cards(t, list, y0 = 330) {
  list.forEach(([n, l1, l2, col, at], i) => {
    const k = prog(t, at, at + .7); if (k <= 0) return;
    const x = 200 + i * 520, y = lerp(-420, y0, outBack(k));
    g.save(); g.translate(x + 240, y + 250); g.rotate((1 - outCubic(k)) * (i - 1) * .25); g.translate(-240, -250);
    panel(0, 0, 480, 500, col, i === 2 ? 50 : 18);
    text(n, 44, 150, { size: 130, weight: 900, color: col }); text(l1, 44, 330, { size: 50, weight: 800 }); text(l2, 44, 396, { size: 50, weight: 800 });
    g.restore();
  });
}
scene(q(0, 6) - .3, t => {
  tin('THE STOCK FELL ANYWAY', 200, 220, { size: 96, weight: 900 }, t, q(0, 6) - .1);
  cards(t, [['01', 'Interest rates', 'climbed', C.amber, q(0, 7) - .2], ['02', 'Does AI spending', 'actually pay off?', C.amber, q(0, 8) - .2], ['03', 'An email', 'from the CEO', C.red, q(0, 9) - .1]]);
});
function quote(t, l1, l2, startAt, attr, attrAt) {
  text('“', 180, 420, { size: 320, weight: 900, color: C.green, alpha: .9 * prog(t, startAt - .6, startAt - .1) });
  text(typed(l1, t, startAt, 20), 240, 470, { size: 112, weight: 800 });
  text(typed(l2, t, startAt + l1.length / 20 + .15, 20), 240, 610, { size: 112, weight: 800 });
  tin(attr, 246, 700, mono({ size: 26, spacing: 4 }), t, attrAt);
}
scene(q(0, 10) - .3, t => {
  quote(t, 'Our company is thirty days', 'from going out of business.', w(0, 'our') - .2, '— JENSEN HUANG, TO HIS EMPLOYEES, FOR THREE DECADES', w(0, 'business') + .2);
  const f = w(0, 'forecast') - .5;
  text('It always sounded like a motto.', 246, 880, { size: 60, weight: 600, color: C.dim, alpha: Math.min(prog(t, q(0, 11), q(0, 11) + .5), 1 - prog(t, f - .3, f)) });
  text('Is it now a forecast?', 246, 880, { size: 76, weight: 900, color: C.red, alpha: prog(t, f, f + .4), glow: C.red });
});
const SLOTS = [[200, 250, 'left'], [1720, 250, 'right'], [1720, 640, 'right'], [200, 640, 'left'], [200, 445, 'left']];
const CLABEL = ['CUSTOMERS BUILDING THEIR OWN CHIPS', 'THE MONEY LOOP', 'THE $800 BILLION BILL', 'CHINA', 'ONE MAN'];
scene(q(0, 13) - .3, t => {
  const a = q(0, 13) + .5, out = q(0, 15) - .2, chipA = 1 - prog(t, out, out + .7);
  if (chipA > 0) { g.save(); g.globalAlpha *= chipA;
    chip(960, 470, 300, CLABEL.map((_, i) => outCubic(prog(t, a + i * .72, a + i * .72 + .7))));
    CLABEL.forEach((lab, i) => { const [sx, sy, al] = SLOTS[i], la = prog(t, a + i * .72 + .25, a + i * .72 + .7);
      text('0' + (i + 1), sx, sy, { size: 60, weight: 900, color: C.red, align: al, alpha: la });
      text(lab, sx, sy + 46, mono({ size: 25, weight: 600, color: C.ink, align: al, alpha: la, spacing: 2 })); });
    g.restore(); }
  const ti = prog(t, out + .5, out + 1.2);
  if (ti > 0) { g.save(); g.globalAlpha *= ti; g.translate(W_ / 2, H_ / 2); const s = lerp(1.25, 1, outCubic(ti)); g.scale(s, s);
    text('CAN NVIDIA', 0, -40, { size: 230, weight: 900, align: 'center' });
    text('FALL?', 0, 190, { size: 260, weight: 900, align: 'center', color: C.red, glow: C.red, blur: 70 });
    text('THE CASE AGAINST THE MOST VALUABLE COMPANY IN HISTORY', 0, 300, mono({ align: 'center', alpha: prog(t, out + 1.3, out + 2) })); g.restore(); }
}, { still: true });

// ===== 1. WHY THIS IS YOUR PROBLEM =====
scene(S(1) - .9, t => {
  const a = q(1, 0);
  head('WHY THIS IS YOUR PROBLEM', null, t, a - .6);
  tin('Your 401(k)', 160, 420, { size: 120, weight: 900 }, t, a - .1);
  tin('owns Nvidia.', 160, 550, { size: 120, weight: 900, color: C.green }, t, w(1, 'own') - .2);
  tin('ONE OF THE BIGGEST PIECES OF THE S&P 500', 166, 640, mono({ size: 26, spacing: 3 }), t, q(1, 1));
  tin('When it moves, your retirement moves.', 166, 780, { size: 50, weight: 700, color: C.amber }, t, q(1, 2));
  // the index as a block of squares, Nvidia's share lit
  const mv = t > q(1, 2) ? Math.sin((t - q(1, 2)) * 9) * 10 * (1 - prog(t, q(1, 2), q(1, 2) + 2.2)) : 0;
  for (let i = 0; i < 100; i++) {
    const cx = 1160 + (i % 10) * 62, cy = 300 + Math.floor(i / 10) * 62, on = i < 8, k = ap(t, a + .2 + i * .012, .4);
    if (k <= 0) continue;
    g.save(); g.globalAlpha *= k;
    const lit = on && t > w(1, 'own') - .3;
    rect(cx, cy + (lit ? mv : mv * .35), 52, 52, lit ? C.green : '#1b231c', lit ? 22 : 0, 6); g.restore();
  }
  tin('NVIDIA', 1160, 270, mono({ size: 24, color: C.green, weight: 700 }), t, w(1, 'own'));
  tin('THE S&P 500', 1780, 950, mono({ size: 24, align: 'right' }), t, q(1, 1));
});
scene(q(1, 3) - .3, t => {
  head('HOW IT GOT THIS BIG', 'Twenty quiet years. Then three loud ones.', t, q(1, 3) - .1, { size: 64 });
  const x0 = 200, x1 = 1720, y0 = 860, split = 1180, a = q(1, 4), b = w(1, 'chatgpt');
  rect(x0, y0 + 40, x1 - x0, 3, C.dim);
  const flat = []; const r = rng(3);
  for (let i = 0; i <= 40; i++) flat.push([lerp(x0, split, i / 40), y0 - 20 - i * 1.4 - r() * 14]);
  const up = [flat[40]]; for (let i = 1; i <= 24; i++) up.push([lerp(split, x1, i / 24), flat[40][1] - Math.pow(i / 24, 1.7) * 470 - r() * 10]);
  polyline(flat, prog(t, a - .2, b - .4), C.dim, 5, 0);
  const tip = polyline(up, inOut(prog(t, b, b + 3.4)), C.green, 7);
  if (t > b) dot(tip, C.green, 10);
  tin('GRAPHICS CARDS FOR GAMERS', 200, y0 + 96, mono({ size: 26, spacing: 3 }), t, a);
  const m = ap(t, b - .2);
  if (m > 0) { g.save(); g.globalAlpha *= m; rect(split - 1, 420, 3, y0 + 40 - 420, C.amber);
    text('NOV 2022', split + 20, 450, mono({ size: 26, color: C.amber, weight: 700, spacing: 3 }));
    text('ChatGPT arrives', split + 20, 506, { size: 46, weight: 800 }); g.restore(); }
  tin('AI RUNS BEST ON NVIDIA CHIPS', split + 20, y0 + 96, mono({ size: 26, spacing: 3, color: C.green }), t, w(1, 'artificial'));
});
scene(q(1, 6) - .3, t => {
  head('YEARLY SALES', 'Three years.', t, q(1, 6) - .1);
  revenueBars(t, [['FISCAL 2023', 27, C.dim, w(1, 'twenty-seven') - .3, 460], ['FISCAL 2026', 216, C.green, w(1, 'two') - .2, 880]]);
  const b = prog(t, w(1, 'sixteen') + .2, w(1, 'sixteen') + .7);
  if (b > 0) { g.save(); g.translate(1540, 540); g.scale(outBack(b), outBack(b));
    text('8×', 0, 0, { size: 220, weight: 900, align: 'center', color: C.green, glow: C.green }); g.restore(); }
  // gross profit strip appears for the next sentence
  const a = q(1, 7) - .2, k = ap(t, a, .9);
  if (k > 0) { g.save(); g.globalAlpha *= k;

function loop(t, names, hops, o = {}) {
  const cx = 960, cy = 590, R = 300, col = o.color || C.green, pos = [[cx, cy - R], [cx + R + 180, cy], [cx, cy + R], [cx - R - 180, cy]];
  const dead = o.deadAt != null ? prog(t, o.deadAt, o.deadAt + .8) : 0;
  // track
  g.save(); g.strokeStyle = col; g.globalAlpha *= .35 * (1 - dead * .7); g.lineWidth = 4; g.setLineDash([14, 14]); g.lineDashOffset = -t * 50 * (1 - dead);
  g.beginPath(); g.ellipse(cx, cy, R + 180, R, 0, 0, 7); g.stroke(); g.restore();
  names.forEach((nm, i) => { const k = ap(t, hops[i] - .3, .5); if (k <= 0) return; const [x, y] = pos[i], isDead = o.deadNode === i && dead > 0;
    g.save(); g.globalAlpha *= k * (isDead ? 1 - dead * .75 : 1);
    panel(x - 190, y - 52, 380, 104, isDead ? C.red : col, isDead ? 0 : 22);
    text(nm, x, y + 13, { size: 34, weight: 800, align: 'center', color: isDead ? C.red : C.ink }); g.restore(); });
  // the coin: travels node to node on the hop times, then keeps circling
  let ang = null;
  for (let i = 0; i < 4; i++) { const a = hops[i], b = hops[i + 1] ?? a + 3; if (t >= a && t < b) ang = (i + inOut(prog(t, a, Math.min(b, a + 2.2)))) / 4; }
  const last = (hops[4] ?? hops[3] + 3); if (t >= last) ang = 1 + (t - last) / 3.2;
  if (o.deadAt != null && t > o.deadAt) ang = null;
  if (ang != null) { const th = -Math.PI / 2 + ang * Math.PI * 2; dot([cx + Math.cos(th) * (R + 180), cy + Math.sin(th) * R], C.amber, 20);
    text('$', cx + Math.cos(th) * (R + 180), cy + Math.sin(th) * R + 10, { size: 28, weight: 900, color: '#1a1200', align: 'center' }); }
  return { cx, cy, laps: ang != null && t >= last ? Math.floor(ang) : 0 };
}

  if (t < S(2) + .5 || t > E(6) + .5) return;

  g.restore();
}

const F = .38;   // half-width of the crossfade between scenes
function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.setLineDash([]);
  background(t);
  for (const s of scenes) {
    if (t < s.start - F || t > s.end + F) continue;
    const a = Math.min(prog(t, s.start - F, s.start + F), 1 - prog(t, s.end - F, s.end + F));
    if (a <= 0) continue;
    g.save(); g.globalAlpha = a;
    if (!s.still) { const z = 1 + .022 * prog(t, s.start, s.end); g.translate(W_ / 2, H_ / 2); g.scale(z, z); g.translate(-W_ / 2, -H_ / 2); }
    s.fn(t); g.restore();
  }
  progressMarks(t);
  const fi = 1 - prog(t, 0, .5), fo = prog(t, DURATION - 1.2, DURATION - .1), o = Math.max(fi, fo);
  if (o > 0) { g.fillStyle = `rgba(0,0,0,${o})`; g.fillRect(0, 0, W_, H_); }
}
window.render = render; window.DURATION = DURATION; window.SCENES = scenes.map(s => [s.start, s.end]);
