<!doctype html>
<html><head><meta charset="utf-8"><title>Thumbnails</title>
<style>
  body { margin: 0; background: #222; font-family: "Inter Display", Inter, sans-serif; }
  .t { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #050606; color: #fff; }
  .abs { position: absolute; }
  .num { font-weight: 900; letter-spacing: -6px; line-height: .9; }
  .tag { font-weight: 900; background: #ffe600; color: #0a0a0a; padding: 10px 26px 12px; display: inline-block; letter-spacing: -1px; }
  .stroke { -webkit-text-stroke: 10px #050606; paint-order: stroke fill; }
</style></head><body>

<!-- A: the loss -->

      </g>
      <path d="M34 -230L-8 -96 48 -18 -16 70 40 230" fill="none" stroke="#ff2a2a" stroke-width="22" stroke-linejoin="round" filter="url(#gl)"/>
      <path d="M34 -230L-8 -96 48 -18 -16 70 40 230" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>

    <path d="M846 610L930 676 824 700Z" fill="#ff2a2a"/>
  </svg>
  <div class="abs num stroke" style="left:48px; top:44px; font-size:250px; color:#ff2a2a;">−$1.7</div>
  <div class="abs num stroke" style="left:56px; top:262px; font-size:150px; letter-spacing:-3px;">TRILLION</div>
  <div class="abs tag" style="left:58px; top:420px; font-size:62px; transform: rotate(-3deg);">IN 5 WEEKS</div>
</div>

<div style="height:40px"></div>
