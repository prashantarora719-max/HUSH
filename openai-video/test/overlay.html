<!doctype html>
<html><head><meta charset="utf-8"><title>Footage-led test: overlay graphics</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Transparent graphics layer that sits over the footage bed. Pure function of time t.
const W = 1920, H = 1080, DURATION = 36;
const g = document.getElementById('c').getContext('2d');
const C = { white: '#ffffff', yellow: '#ffe600', red: '#ff2a2a', dim: 'rgba(255,255,255,.72)' };
const SANS = '"Inter Display", Inter, sans-serif', MONO = '"JetBrains Mono", monospace';
const CUTS = [0, 2.2, 4.4, 6.6, 9.0, 11.4, 14.4, 17.4, 20.6, 23.4, 26.6, 27.2, 27.8, 28.4, 29.0, 36];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a)), outCubic = k => 1 - Math.pow(1 - k, 3), outExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const outBack = k => 1 + 2.6 * Math.pow(k - 1, 3) + 1.6 * Math.pow(k - 1, 2);

function text(s, x, y, o = {}) {
  g.save(); g.font = `${o.weight || 900} ${o.size || 100}px ${o.font || SANS}`; g.textAlign = o.align || 'left'; g.globalAlpha *= o.alpha ?? 1;
  if (o.spacing != null) g.letterSpacing = o.spacing + 'px';
  g.shadowColor = 'rgba(0,0,0,.75)'; g.shadowBlur = o.blur ?? 28; g.shadowOffsetY = 6; g.fillStyle = o.color || C.white; g.fillText(s, x, y); g.restore();
}
function width(s, o = {}) { g.save(); g.font = `${o.weight || 900} ${o.size || 100}px ${o.font || SANS}`; if (o.spacing != null) g.letterSpacing = o.spacing + 'px'; const m = g.measureText(s).width; g.restore(); return m; }
// a word or line that punches in: quick scale-down into place
function pop(s, x, y, o, t, at, d = .16) {
  const k = prog(t, at, at + d); if (k <= 0) return; const sc = lerp(1.22, 1, outCubic(k)), wd = width(s, o), ax = o.align === 'center' ? 0 : o.align === 'right' ? -wd / 2 : wd / 2;
  g.save(); g.translate(x + ax, y - (o.size || 100) * .35); g.scale(sc, sc); g.translate(-(x + ax), -(y - (o.size || 100) * .35)); text(s, x, y, { ...o, alpha: (o.alpha ?? 1) * Math.min(1, k * 2.2) }); g.restore();
}
// several words popping in one after another on a line
function words(list, x, y, o, t, at, gap = .17) { let cx = x; list.forEach(([w, col], i) => { pop(w, cx, y, { ...o, color: col || o.color }, t, at + i * gap); cx += width(w + ' ', o); }); }
const label = (s, x, y, t, at, o = {}) => { const k = outCubic(prog(t, at, at + .3)); if (k > 0) text(s, x - (1 - k) * 30, y, { font: MONO, weight: 600, size: 30, spacing: 6, color: C.dim, alpha: k, blur: 12, ...o }); };
const bar = (x, y, wd, h, col, t, at, d = .35) => { const k = outExpo(prog(t, at, at + d)); if (k > 0) { g.fillStyle = col; g.fillRect(x, y, wd * k, h); } };
const shot = (t, i) => t >= CUTS[i] && t < CUTS[i + 1];

function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.globalAlpha = 1;
  // readability gradient along the bottom, and a white flash on each cut
  const gr = g.createLinearGradient(0, H * .45, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.62)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  CUTS.slice(1, -1).forEach(c => { const f = 1 - prog(t, c, c + .11); if (t >= c && f > 0) { g.fillStyle = `rgba(255,255,255,${.22 * f})`; g.fillRect(0, 0, W, H); } });

  if (shot(t, 0)) { label('PAPER TRILLIONS  ·  ENTRY NO. 2', 140, 160, t, .25); words([['THIS'], ['COMPANY'], ['IS'], ['WORTH']], 140, 900, { size: 120, spacing: -3 }, t, .5); }
  if (shot(t, 1)) { const k = outExpo(prog(t, 2.25, 3.5)); bar(140, 560, 16, 330, C.yellow, t, 2.2, .25);
    pop('$' + (1.25 * k).toFixed(2), 190, 800, { size: 330, color: C.yellow, spacing: -10 }, t, 2.22); pop('TRILLION', 196, 910, { size: 110, spacing: 2 }, t, 3.0); }
  if (shot(t, 2)) { const k = prog(t, 4.55, 4.75); if (k > 0) { const sc = lerp(2.4, 1, outCubic(k)); g.save(); g.translate(W / 2, 580); g.rotate(-.045); g.scale(sc, sc); g.globalAlpha = Math.min(1, k * 2);
      g.fillStyle = C.red; g.fillRect(-560, -150, 1120, 250); text('ON PAPER.', 0, 60, { size: 190, align: 'center', spacing: -4, blur: 0 }); g.restore(); } }
  if (shot(t, 3)) { label('LAST QUARTER', 140, 160, t, 6.7); label('MONEY IN', 140, 730, t, 7.0, { color: C.white }); bar(140, 760, 16, 170, C.white, t, 7.0, .25);
    const k = outExpo(prog(t, 7.2, 8.2)); pop('$' + (6.7 * k).toFixed(1) + ' BILLION', 190, 910, { size: 170, spacing: -5 }, t, 7.15); }
  if (shot(t, 4)) { label('MONEY LOST', 140, 730, t, 9.05, { color: C.red }); bar(140, 760, 16, 170, C.red, t, 9.05, .25);
    const k = outExpo(prog(t, 9.15, 10.2)); pop('−$' + (12.3 * k).toFixed(1) + ' BILLION', 190, 910, { size: 170, color: C.red, spacing: -5 }, t, 9.1); }
  if (shot(t, 5)) { words([['FOR'], ['EVERY'], ['$1', C.yellow], ['IT'], ['EARNS']], 140, 760, { size: 124, spacing: -3 }, t, 11.5, .16);
    words([['IT'], ['LOSES'], ['ALMOST'], ['$2', C.red]], 140, 910, { size: 150, spacing: -4 }, t, 12.7, .18); }
  if (shot(t, 6)) { label('PROMISED, FOR COMPUTING POWER', 140, 700, t, 14.5); const full = '$856,000,000,000', n = Math.ceil(prog(t, 14.55, 15.7) * full.length);
    text(full.slice(0, n), 134, 900, { size: 186, color: C.yellow, spacing: -6 }); }
  if (shot(t, 7)) { words([['MONEY'], ['IT'], ['DOES']], 140, 760, { size: 150, spacing: -4 }, t, 17.5, .15); words([['NOT', C.red], ['HAVE', C.red], ['YET.', C.red]], 140, 920, { size: 170, spacing: -5 }, t, 18.1, .2); }
  if (shot(t, 8)) { words([['OF'], ['EVERY'], ['20', C.yellow], ['USERS']], 140, 900, { size: 160, spacing: -4 }, t, 20.75, .17); }
  if (shot(t, 9)) { for (let i = 0; i < 20; i++) { const k = outBack(prog(t, 23.5 + i * .035, 23.75 + i * .035)); if (k <= 0) continue; const x = 190 + i * 82, y = 640, pays = i === 19 && t > 25.0;
      g.save(); g.translate(x, y); g.scale(k * (pays ? 1.25 : 1), k * (pays ? 1.25 : 1)); g.fillStyle = pays ? C.yellow : C.white; g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 16;
      g.beginPath(); g.arc(0, -34, 16, 0, 7); g.fill(); g.beginPath(); g.roundRect(-24, -12, 48, 62, 20); g.fill(); g.restore(); }
    words([['19', C.red], ['PAY', C.red], ['NOTHING.', C.red]], 140, 900, { size: 190, spacing: -5 }, t, 24.2, .2); }
  // the fast montage: one word per flash
  [['THIS', 26.6], ['IS', 27.2], ['WHERE', 27.8], ['IT', 28.4]].forEach(([w, at], i) => { if (shot(t, 10 + i)) pop(w, W / 2, 610, { size: 300, align: 'center', spacing: -8 }, t, at, .1); });
  if (t >= 29.0) { const k = outCubic(prog(t, 29.0, 29.5)); g.fillStyle = `rgba(0,0,0,${.35 * k})`; g.fillRect(0, 0, W, H);
    pop('GOES', W / 2, 610, { size: 300, align: 'center', spacing: -8, alpha: 1 - prog(t, 29.7, 30.0) }, t, 29.0, .1);
    pop('OpenAI', W / 2, 560, { size: 330, align: 'center', spacing: -10 }, t, 30.1, .22);
    words([['WHERE'], ['THE'], ['MONEY', C.yellow], ['GOES', C.yellow]], W / 2 - width('WHERE THE MONEY GOES', { size: 96, spacing: 2 }) / 2, 720, { size: 96, spacing: 2 }, t, 31.0, .18);
    label('PAPER TRILLIONS', W / 2, 960, t, 32.2, { align: 'center', color: C.white }); }
  const o = Math.max(1 - prog(t, 0, .35), prog(t, DURATION - .9, DURATION - .1)); if (o > 0) { g.fillStyle = `rgba(0,0,0,${o})`; g.fillRect(0, 0, W, H); }
}
window.render = render; window.DURATION = DURATION; window.CUTS = CUTS; render(+new URLSearchParams(location.search).get('t') || 0);
</script></body></html>
