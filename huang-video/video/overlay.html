  g.save(); g.translate(x + ax, y - (o.size || 100) * .35); g.scale(sc, sc); g.translate(-(x + ax), -(y - (o.size || 100) * .35)); text(s, x, y, { ...o, alpha: (o.alpha ?? 1) * Math.min(1, k * 2.2) }); g.restore();

function render(t) {

    const o = { font: MONO, weight: 700, size: 34, spacing: 4 }, part = `PART ${i + 1} OF ${CHAPTERS.length}`, w1 = width(part, o) + 48; g.save(); g.globalAlpha = out;
    g.fillStyle = C.y; g.fillRect(140, 110, w1 * k, 64); g.save(); g.beginPath(); g.rect(140, 110, w1 * k, 64); g.clip(); text(part, 164, 154, { ...o, color: '#111', blur: 0 }); g.restore();
    const k2 = outCubic(prog(t, t0 + .25, t0 + .6)); if (k2 > 0) text(name, 140 + w1 + 28 - (1 - k2) * 20, 156, { size: 44, weight: 800, alpha: k2, spacing: 1 });
