<!doctype html><html><head><meta charset="utf-8"><title>The AI Ledger brand</title>
<style>
 body{margin:0;background:#222;font-family:"Inter Display",Inter,sans-serif}

 #banner{width:2560px;height:1440px;position:relative;overflow:hidden;margin-top:40px}

<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <g id="mark">

  </g>
 </g>
</defs></svg>

<div id="avatar" class="grid"><div class="vig"></div>
 <svg class="abs" width="800" height="800" viewBox="-400 -400 800 800"><use href="#mark" transform="scale(1.5)"/></svg>
</div>
