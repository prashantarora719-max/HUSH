<!doctype html><html><head><meta charset="utf-8"><title>Colour comparison</title>
<style>body{margin:0;font-family:"Inter Display",Inter,sans-serif}
#s{width:1600px;height:640px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.c{display:flex;align-items:center;gap:28px;padding:0 60px}.d{background:#0f0f0f;color:#f1f1f1}.l{background:#fff;color:#0f0f0f}
.a{border-radius:50%;background:#07090a;overflow:hidden;flex:none}.t{font-size:30px;font-weight:700}.u{font-size:20px;opacity:.6;font-weight:500}</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<g id="book"><g fill="none" stroke-width="18" stroke-linejoin="round" filter="url(#g)"><path d="M0 -84 L-132 -112 V88 L0 116 Z"/><path d="M0 -84 L132 -112 V88 L0 116 Z"/></g>
<g stroke-width="18" stroke-linecap="round"><path d="M-98 -50 L-34 -37 M-98 -2 L-34 11" stroke="#f2f5f0"/><path d="M98 -50 L34 -37" stroke="#f2f5f0"/><path d="M98 -2 L34 11" stroke="#ff3d3d"/></g></g></defs></svg>
<div id="s"></div><script>
const m=(c,s)=>`<div class="a" style="width:${s}px;height:${s}px"><svg width="${s}" height="${s}" viewBox="-200 -200 400 400"><use href="#book" stroke="${c}" transform="scale(1.3)"/></svg></div>`;
const row=(cls,c,name)=>`<div class="c ${cls}">${m(c,176)}${m(c,88)}${m(c,36)}<div><div class="t">The AI Ledger</div><div class="u">${name}</div></div></div>`;
document.getElementById('s').innerHTML=row('d','#ffb020','Gold, YouTube dark mode')+row('d','#84e11a','Green, YouTube dark mode')+row('l','#ffb020','Gold, YouTube light mode')+row('l','#84e11a','Green, YouTube light mode');
</script></body></html>
